name: campus_quicksplit
description: "Campus QuickSplit — Frictionless Local-First Peer Expense Tracker"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State management. We use plain (non-code-generated) Riverpod
  # providers rather than riverpod_generator: it avoids a second
  # code-generation pipeline on top of Drift's, which keeps the build
  # graph simpler for a project this size while still giving us fully
  # testable, compile-checked providers.
  flutter_riverpod: ^2.6.1

  # Local database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0

  intl: ^0.19.0

  # Unique ids for local-only records
  uuid: ^4.5.1

  # Group-invite QR generation and camera scanning.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # Opens a standards-based UPI payment URI in a compatible payment app.
  # This only assists payment initiation; it does not verify a payment.
  url_launcher: ^6.3.1

  # Optional, on-device convenience features. These plugins never upload
  # financial data: receipts stay local, backups use the OS picker, and the
  # lock delegates authentication to the device.
  image_picker: ^1.2.3
  file_selector: ^1.1.0
  share_plus: ^12.0.1
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  # Optional cloud services. Local SQLite remains the source of truth and the
  # app stays fully usable when Firebase has not been configured.
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation for Drift
  build_runner: ^2.4.13
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
